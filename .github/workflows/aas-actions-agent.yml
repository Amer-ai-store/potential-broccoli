name: AAS Actions AI — Monitor & Safe Repair
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/aas-actions-agent.yml"

permissions:
  contents: read

concurrency:
  group: aas-actions-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Safety tests (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3, Node 24
        with:
          persist-credentials: false
      - name: Run agent safety tests
        run: python3 -m unittest discover -s agent/tests -v

  diagnose:
    name: GitHub API monitor and AI triage (NO deployment)
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: write
      issues: write
      models: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3, Node 24
        with:
          persist-credentials: false
      - name: Inspect Actions and perform bounded safe repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AAS_REPO: ${{ github.repository }}
          AAS_AI_MODEL: openai/gpt-4.1-mini
        run: python3 agent/monitor_actions.py
